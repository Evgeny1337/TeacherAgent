[project]
name = "teacher-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "intake*", "plan*"]

# .md и шаблон docx должны попадать в wheel при pip install.
[tool.setuptools.package-data]
intake = ["llm/*.md"]
plan = ["generate/*.md", "recordWord/*.docx"]

[tool.setuptools]
include-package-data = true